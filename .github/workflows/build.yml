name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The gate. Nothing is packaged and nothing reaches a user unless the suite
  # passes first, on every platform we ship to. v0.4.21 went out with a crash
  # that the suite catches in under a second, because until now the suite was
  # never run here — the workflow only ever built installers.
  #
  # fail-fast is off so one platform's failure reports the other two rather than
  # cancelling them; when something breaks we want to know if it broke everywhere
  # or only in one place.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Every action here is on the major that runs under Node 24. The runners
      # stopped shipping Node 20 in September 2025 and have been forcing the old
      # majors onto 24 since — announced as a temporary kindness, which is not a
      # thing to build a release on. Nothing in this file uses an input that
      # changed across those majors; the bumps are runtime and ESM only.
      - uses: actions/checkout@v7

      # Node 22 rather than 20: Node 20 reached end of life on 2026-04-30, so the
      # suite had been proving the app works on a runtime that no longer gets
      # security fixes. 22 is supported to 2027-04-30 and is what the app is
      # developed against.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        # onnxruntime-node's postinstall otherwise downloads the CUDA and
        # TensorRT execution providers on Linux x64 — 315 MB of GPU libraries
        # this app never asks for, since it runs on the CPU provider. Skipping
        # them keeps `npm ci` quick and the installers small.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # Before the suite, because a lint error is a second-long answer and the
      # suite is a forty-second one. Warnings count: every deliberate exception
      # in the tree carries a comment saying why, so a new warning is genuinely
      # new information rather than more of a backlog nobody reads.
      - name: Lint
        run: npm run lint

      # Formatting, on one runner only: prettier reads the same files and the
      # same .prettierrc.json wherever it runs, so checking it three times is
      # three times the minute for one answer. It runs at all because it had
      # stopped being true — the tree drifted 69 files out of format under a
      # prettier that `npm ci` had been installing for months, and nothing here
      # ever said so. `npm ci` installs the locked version, so this asks about
      # the tree rather than about whose machine ran it.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: npm run format:check

      # `npm test` discovers its own files rather than relying on the shell to
      # expand a glob, so this is the same command, running the same tests, on
      # all three runners including PowerShell.
      - name: Run tests
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        # onnxruntime-node's postinstall otherwise downloads the CUDA and
        # TensorRT execution providers on Linux x64 — 315 MB of GPU libraries
        # this app never asks for, since it runs on the CPU provider. Skipping
        # them keeps `npm ci` quick and the installers small.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # --publish never: build artifacts only. On tag pushes electron-builder would
      # otherwise try to create the GitHub Release itself and 403, since publishing
      # is the dedicated `release` job's responsibility (it holds contents: write).
      - name: Build renderer + package app
        run: npm run dist -- --publish never
        env:
          # electron-builder skips code signing when no certs are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: lanchat-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v8 fails the run on a digest mismatch rather than logging a warning and
      # carrying on, which is the behaviour worth having here: this job's output
      # is the file a user downloads and runs.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
